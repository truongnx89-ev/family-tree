<header>
<div class="logo"><svg width="46" height="52" viewBox="0 0 46 52"><circle cx="23" cy="18" r="16" fill="#1f7a57"/><circle cx="12" cy="24" r="9" fill="#2e8f69"/><circle cx="34" cy="24" r="9" fill="#2e8f69"/><rect x="20" y="28" width="6" height="22" fill="#14543b"/></svg><div><b>Cây Gia Phả</b><small>Gìn giữ cội nguồn - Kết nối yêu thương</small></div></div>

<main>
<section class="center">

<script>
const KEY='giapha_ngo_v1';
const seed=()=>[];
let M;try{M=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(M&&!Array.isArray(M))M=M.members||M.data||M.M;M=Array.isArray(M)?M.map(norm).filter(Boolean):seed();
const save=()=>sv(KEY,M);
let sel=M[0]?.id,view='tree',gen=0,q='',zoom=1,tab=0,page='home';if(innerWidth<800)zoom=.6;
const $=s=>document.querySelector(s),get=id=>M.find(m=>m.id==id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const role=m=>m.g=='M'?'Nam':'Nữ';

const av=m=>{if(m.img)return`<img src="${m.img}" alt="">`;const c=m.g=='M'?['#cfe3f6','#2f6fa3']:['#fad8c6','#c0643a'];return`<svg viewBox="0 0 60 60"><rect width="60" height="60" fill="${c[0]}"/><circle cx="30" cy="24" r="11" fill="#f1c9a5"/><path d="M18 22a12 12 0 0124 0c-4-6-18-6-24 0z" fill="#2b2b2b"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="${c[1]}"/></svg>`};
const match=m=>!q||(m.name+' '+m.id+' '+m.by+' '+m.home).toLowerCase().includes(q);
const MENU=[['set','','Cài đặt']];
const NAV=[['home','🏠','Trang chủ'],['tree','🌳','Cây gia phả'],['img','🖼️','Hình ảnh'],['ev','📅','Sự kiện']];
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));localStorage.setItem('dirty_'+k,'1');try{sessionStorage.setItem('sd_'+k,'1')}catch(e){}return true}catch(e){alert('Bộ nhớ trình duyệt đầy — hãy dùng ảnh nhỏ hơn hoặc xóa bớt ảnh.');return false}}
const UK='giapha_users_v1';let users=ld(UK,[]),cur=null;if(!Array.isArray(users))users=users.users||[];
try{cur=users.find(u=>u.u==localStorage.getItem('giapha_sess'))||null}catch(e){}
const can=k=>!!cur&&(cur.role=='admin'||!!cur[k]),adm=()=>cur?.role=='admin';
const hash=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let C=ld('giapha_content_v1',null)||{home:{title:'Gia phả dòng họ Ngô',text:'Gìn giữ cội nguồn - Kết nối yêu thương.',imgs:[]},gallery:[],events:[]};

function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)}
function pickImg(max,cb,multi){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.onchange=()=>[...i.files].forEach(f=>shrink(f,max,cb));i.click()}
const btns='<div style="margin-top:14px;text-align:right">';
function userForm(){$('#fm').innerHTML=`<h3 style="margin-top:0">Thêm tài khoản</h3><label>Tên đăng nhập</label><input id="u_u" required autocomplete="off"><label>Tên hiển thị</label><input id="u_n"><label>Mật khẩu (≥ 6 ký tự)</label><input id="u_p" type="password" required autocomplete="new-password"><label>Vai trò</label><select id="u_r"><option value="user">Người dùng</option><option value="admin">Admin</option></select>${btns}<button type="button" class="btn" id="u_cx">Hủy</button> <button class="btn p">Lưu</button></div>`;
 $('#dlg').showModal();$('#u_cx').onclick=()=>$('#dlg').close();
 $('#fm').onsubmit=async e=>{e.preventDefault();if(!adm())return;const u=$('#u_u').value.trim().toLowerCase(),p=$('#u_p').value;
  if(u.length<3||p.length<6)return alert('Tên đăng nhập ≥ 3 ký tự, mật khẩu ≥ 6 ký tự.');if(users.some(x=>x.u==u))return alert('Tên đăng nhập đã tồn tại.');
  const salt=crypto.randomUUID();users.push({u,name:$('#u_n').value.trim()||u,salt,h:await hash(p,salt),role:$('#u_r').value,edit:false,content:false});sv(UK,users);$('#dlg').close();render()}}
function pwForm(u){const x=users.find(y=>y.u==u);if(!x)return;$('#fm').innerHTML=`<h3 style="margin-top:0">Đổi mật khẩu: ${esc(x.u)}</h3><label>Mật khẩu mới (≥ 6 ký tự)</label><input id="w_p" type="password" required autocomplete="new-password">${btns}<button type="button" class="btn" id="w_cx">Hủy</button> <button class="btn p">Lưu</button></div>`;
 $('#dlg').showModal();$('#w_cx').onclick=()=>$('#dlg').close();
 $('#fm').onsubmit=async e=>{e.preventDefault();if(!adm())return;const p=$('#w_p').value;if(p.length<6)return alert('Mật khẩu phải có ít nhất 6 ký tự.');
  x.salt=crypto.randomUUID();x.h=await hash(p,x.salt);sv(UK,users);$('#dlg').close();alert('Đã đổi mật khẩu cho '+x.u+'.')}}
function authForm(reg){if(reg&&users.length)return;$('#fm').innerHTML=`<h3 style="margin-top:0">${reg?'Tạo tài khoản':'Đăng nhập'}</h3>${reg&&!users.length?'<p style="color:var(--g)">Tài khoản đầu tiên sẽ là Admin.</p>':''}${reg?'<label>Tên hiển thị</label><input id="a_n">':''}<label>Tên đăng nhập</label><input id="a_u" required autocomplete="username"><label>Mật khẩu</label><input id="a_p" type="password" required autocomplete="${reg?'new-password':'current-password'}">${btns}<button type="button" class="btn" id="a_cx">Hủy</button> <button class="btn p">${reg?'Đăng ký':'Đăng nhập'}</button></div>`;
 $('#dlg').showModal();$('#a_cx').onclick=()=>$('#dlg').close();
 $('#fm').onsubmit=async e=>{e.preventDefault();const u=$('#a_u').value.trim().toLowerCase(),p=$('#a_p').value;
  if(reg){if(u.length<3||p.length<6)return alert('Tên đăng nhập ≥ 3 ký tự, mật khẩu ≥ 6 ký tự.');if(users.some(x=>x.u==u))return alert('Tên đăng nhập đã tồn tại.');const salt=crypto.randomUUID();users.push({u,name:$('#a_n').value.trim()||u,salt,h:await hash(p,salt),role:users.length?'user':'admin',edit:false,content:false});sv(UK,users);cur=users[users.length-1]}
  else{const x=users.find(y=>y.u==u);if(!x||x.h!=await hash(p,x.salt))return alert('Sai tên đăng nhập hoặc mật khẩu.');cur=x}

function orderBase(V,gens){
 const pos={},rows=[];
 gens.forEach(g=>{const L=V.filter(m=>m.gen==g),seen=new Set(),U=[];
  const pp=m=>{const a=[m.fid,m.mid].filter(x=>x&&pos[x]!=null).map(x=>pos[x]);return a.length?Math.min(...a):null};
  L.forEach(m=>{if(seen.has(m.id))return;const comp=[m];seen.add(m.id);
   for(let i=0;i<comp.length;i++)comp[i].sids.forEach(s=>{const o=get(s);if(o&&o.gen==g&&!seen.has(o.id)&&!hid.has(o.id)&&(!FS||FS.has(o.id))){seen.add(o.id);comp.push(o)}});
   const ks=comp.map(pp).filter(k=>k!=null);
   comp.sort((a,b)=>(pp(b)!=null)-(pp(a)!=null)||(a.g=='M'?-1:1)-(b.g=='M'?-1:1)||a.id-b.id);
   if(comp.length==2&&comp[0].g=='F'&&comp[1].g=='M')comp.reverse();
   U.push({c:comp,k:ks.length?Math.min(...ks):9999,id:Math.min(...comp.map(x=>x.id))})});
  U.sort((a,b)=>a.k-b.k||a.id-b.id);
  let p=0;U.forEach(u=>u.c.forEach(m=>pos[m.id]=p++));
  rows.push([g,U.map(u=>u.c)])});
 return rows;
}

/* Sắp xếp lại thứ tự thẻ trong từng đời để giảm tối đa số đường nối cắt nhau.
   Bắt đầu từ thứ tự gốc (orderBase), lặp các lượt quét xuống/lên theo "trọng tâm"
   cha mẹ/con cái, tự lật chiều vợ-chồng khi giúp bớt cắt nhau, và chỉ giữ kết quả nếu ít cắt hơn. */
function order(){
 hid=hiddenSet();
 const V=M.filter(m=>!hid.has(m.id)&&(!FS||FS.has(m.id))),gens=[...new Set(V.map(m=>m.gen))].sort((a,b)=>a-b);
 const rows=orderBase(V,gens);

 rows.forEach((r,i)=>r[1].forEach(u=>u.forEach(m=>R[m.id]=i)));
 const kids={};V.forEach(m=>[m.fid,m.mid].forEach(p=>{if(p&&R[p]!=null&&R[m.id]==R[p]+1)(kids[p]=kids[p]||[]).push(m.id)}));
 const place=()=>{const P={},N=[],U={};gm.forEach((us,i)=>{let p=0;us.forEach(u=>u.forEach(m=>{P[m.id]=p++;U[m.id]=u}));N[i]=p});return{P,N,U}};
 const upA=(m,i,pl)=>{const a=[m.fid,m.mid].filter(x=>x&&R[x]==i-1&&pl.P[x]!=null);if(!a.length)return null;if(a.length==2&&pl.U[a[0]]===pl.U[a[1]])return Math.max(pl.P[a[0]],pl.P[a[1]])/pl.N[i-1];return a.map(x=>(pl.P[x]+.5)/pl.N[i-1]).reduce((x,y)=>x+y)/a.length};
 const dnA=(m,i,pl)=>{const k=(kids[m.id]||[]).map(x=>(pl.P[x]+.5)/pl.N[i+1]);return k.length?k.reduce((x,y)=>x+y)/k.length:null};

  for(let i=1;i<n;i++){const L=[];gm[i].forEach(u=>u.forEach(m=>{const a=upA(m,i,pl);if(a!=null)L.push([a,(pl.P[m.id]+.5)/pl.N[i]])}));
   for(let x=0;x<L.length;x++)for(let y=x+1;y<L.length;y++)if((L[x][0]-L[y][0])*(L[x][1]-L[y][1])<-1e-9)c+=1000;
   L.forEach(l=>c+=Math.abs(l[0]-l[1]))}
  return c};

 const sweep=(i,A)=>{const pl=place();
  const key=u=>{const v=u.map(m=>A(m,i,pl)).filter(x=>x!=null);return v.length?v.reduce((x,y)=>x+y)/v.length:null};
  gm[i].forEach(u=>{if(u.length<2)return;const[a,b]=inv(u.map(m=>A(m,i,pl)));if(b<a)u.reverse()});

  gm[i]=gm[i].map((u,j)=>({u,j,k:key(u)??cur.get(u)})).sort((x,y)=>x.k-y.k||x.j-y.j).map(o=>o.u)};

 let best=snap(),bc=cost();
 for(let it=0;it<8;it++){
  for(let i=1;i<n;i++)sweep(i,upA);

  for(let i=n-2;i>=0;i--)sweep(i,dnA);

 }
 return rows.map((r,i)=>[r[0],best[i]]);
}

// Đồng bộ với file JSON trên máy chủ/GitHub mỗi lần tải trang
(function syncRemote(){
 window.__ld='';
 const FILES=[['giapha_ngo_v1','./giapha_ngo_v1.json',1],['giapha_users_v1','./giapha_users_v1.json',0],['giapha_content_v1','./giapha_content_v1.json',0]];
 const canon=(k,j)=>{if(k=='giapha_ngo_v1'){const a=Array.isArray(j)?j:(j&&(j.members||j.data||j.M))||[];return JSON.stringify(a.map(norm).filter(Boolean))}return JSON.stringify(j)};
 const rd=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
 let reload=false,pend=FILES.length;
 FILES.forEach(([k,p,must])=>{
  fetch(p+'?v='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():Promise.reject('HTTP '+r.status)).then(d=>{
   const loc=rd(k),dirty=k=='giapha_ngo_v1'?localStorage.getItem('dirty_'+k):sessionStorage.getItem('sd_'+k),empty=loc==null||(Array.isArray(loc)&&!loc.length);
   if(!empty&&canon(k,loc)==canon(k,d)){localStorage.removeItem('dirty_'+k);sessionStorage.removeItem('sd_'+k)}
   else if(!dirty||empty){localStorage.setItem(k,JSON.stringify(d));localStorage.removeItem('dirty_'+k);reload=true}
  }).catch(e=>{if(must&&!(rd(k)||[]).length)window.__ld='Không nạp được '+p+' ('+e+'). Kiểm tra tên file, đường dẫn và định dạng JSON.'})
  .finally(()=>{if(--pend)return;const n=+sessionStorage.getItem('syncn')||0;
   if(reload&&n<3){sessionStorage.setItem('syncn',n+1);location.reload()}else{if(!reload)sessionStorage.removeItem('syncn');render()}})});
})();


render();
</script>
