<style>

<header>

<section class="center">

<script>
const KEY='giapha_ngo_v1';
const seed=()=>[];
let M;try{M=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!Array.isArray(M)||!M.length||!M.every(m=>Array.isArray(m.sids)))M=seed();
const save=()=>sv(KEY,M);
let sel=M[0]?.id,view='tree',gen=0,q='',zoom=1,tab=0,page='home';
const $=s=>document.querySelector(s),get=id=>M.find(m=>m.id==id);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const role=m=>m.g=='M'?'Nam':'Nữ';
const years=m=>m.by||m.dy?`(${m.by||''} - ${m.dy||''})`:'';
const av=m=>{if(m.img)return`<img src="${m.img}" alt="">`;const c=m.g=='M'?['#cfe3f6','#2f6fa3']:['#fad8c6','#c0643a'];return`<svg viewBox="0 0 60 60"><rect width="60" height="60" fill="${c[0]}"/><circle cx="30" cy="24" r="11" fill="#f1c9a5"/><path d="M18 22a12 12 0 0124 0c-4-6-18-6-24 0z" fill="#2b2b2b"/><path d="M8 60c2-16 12-22 22-22s20 6 22 22z" fill="${c[1]}"/></svg>`};
const match=m=>!q||(m.name+' '+m.id+' '+m.by+' '+m.home).toLowerCase().includes(q);
const MENU=[['set','','Cài đặt']];
const NAV=[['home','🏠','Trang chủ'],['tree','🌳','Cây gia phả'],['img','🖼️','Hình ảnh'],['ev','📅','Sự kiện']];
function ld(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true}catch(e){alert('Bộ nhớ trình duyệt đầy — hãy dùng ảnh nhỏ hơn hoặc xóa bớt ảnh.');return false}}
const UK='giapha_users_v1';let users=ld(UK,[]),cur=null;
try{cur=users.find(u=>u.u==localStorage.getItem('giapha_sess'))||null}catch(e){}
const can=k=>!!cur&&(cur.role=='admin'||!!cur[k]),adm=()=>cur?.role=='admin';
const hash=async(p,s)=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s+':'+p)))].map(b=>b.toString(16).padStart(2,'0')).join('');
let C=ld('giapha_content_v1',null)||{home:{title:'Gia phả dòng họ Ngô',text:'Gìn giữ cội nguồn - Kết nối yêu thương.',imgs:[]},gallery:[],events:[]};
const csave=()=>sv('giapha_content_v1',C);
function shrink(f,max,cb){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);cb(c.toDataURL('image/jpeg',.78))};im.src=r.result};r.readAsDataURL(f)}
function pickImg(max,cb,multi){const i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.onchange=()=>[...i.files].forEach(f=>shrink(f,max,cb));i.click()}
const btns='<div style="margin-top:14px;text-align:right">';
function authForm(reg){$('#fm').innerHTML=`<h3 style="margin-top:0">${reg?'Tạo tài khoản':'Đăng nhập'}</h3>${reg&&!users.length?'<p style="color:var(--g)">Tài khoản đầu tiên sẽ là Admin.</p>':''}${reg?'<label>Tên hiển thị</label><input id="a_n">':''}<label>Tên đăng nhập</label><input id="a_u" required autocomplete="username"><label>Mật khẩu</label><input id="a_p" type="password" required autocomplete="${reg?'new-password':'current-password'}">${btns}<button type="button" class="btn" id="a_cx">Hủy</button> <button class="btn p">${reg?'Đăng ký':'Đăng nhập'}</button></div>`;
 $('#dlg').showModal();$('#a_cx').onclick=()=>$('#dlg').close();
 $('#fm').onsubmit=async e=>{e.preventDefault();const u=$('#a_u').value.trim().toLowerCase(),p=$('#a_p').value;
  if(reg){if(u.length<3||p.length<6)return alert('Tên đăng nhập ≥ 3 ký tự, mật khẩu ≥ 6 ký tự.');if(users.some(x=>x.u==u))return alert('Tên đăng nhập đã tồn tại.');const salt=crypto.randomUUID();users.push({u,name:$('#a_n').value.trim()||u,salt,h:await hash(p,salt),role:users.length?'user':'admin',edit:false,content:false});sv(UK,users);cur=users[users.length-1]}
  else{const x=users.find(y=>y.u==u);if(!x||x.h!=await hash(p,x.salt))return alert('Sai tên đăng nhập hoặc mật khẩu.');cur=x}
  try{localStorage.setItem('giapha_sess',cur.u)}catch(e){}$('#dlg').close();render()}}
function adminPanel(){if(!adm())return'';const ck=(x,k)=>`<input type="checkbox" data-u="${esc(x.u)}" data-k="${k}" ${x[k]||x.role=='admin'?'checked':''} ${x.role=='admin'?'disabled':''}>`;
 return`<div class="adm"><b>🛡️ Bảng điều khiển phân quyền</b> <small style="color:var(--mu)">Admin: toàn quyền · Người dùng: chỉ xem trừ khi được cấp quyền</small><div style="max-height:190px;overflow:auto"><table><thead><tr><th>Tài khoản</th><th>Tên</th><th>Vai trò</th><th>Sửa thành viên</th><th>Sửa nội dung/ảnh</th><th></th></tr></thead><tbody>${users.map(x=>`<tr><td>${esc(x.u)}</td><td>${esc(x.name)}</td><td><select data-u="${esc(x.u)}" data-k="role"><option value="user" ${x.role=='user'?'selected':''}>Người dùng</option><option value="admin" ${x.role=='admin'?'selected':''}>Admin</option></select></td><td>${ck(x,'edit')}</td><td>${ck(x,'content')}</td><td>${x.u==cur.u?'':`<button class="btn d" data-act="udel" data-i="${esc(x.u)}">Xóa</button>`}</td></tr>`).join('')}</tbody></table></div></div>`}
document.addEventListener('change',e=>{const t=e.target,u=t.dataset&&t.dataset.u;if(!u||!adm())return;const x=users.find(y=>y.u==u);if(!x)return;
 if(t.dataset.k=='role'){if(x.role=='admin'&&t.value!='admin'&&users.filter(y=>y.role=='admin').length<2){alert('Phải còn ít nhất một Admin.');render();return}x.role=t.value}else x[t.dataset.k]=t.checked;
 sv(UK,users);render()});
function act(a,i){const ct=can('content');
 if(a=='open'){showLb(curAlb(),+i);return}
 if(a=='oa'){alb=+i;return render()}
 if(a=='ob'){alb=0;return render()}
 if(a=='aren'&&ct){const n=prompt('Tên album',curAlb().name);if(!n||!n.trim())return;curAlb().name=n.trim()}
 else if(a=='adel'&&ct){if(!confirm('Xóa album và toàn bộ ảnh trong album?'))return;C.albums=C.albums.filter(x=>x.id!=i)}
 else if(a=='hdel'&&ct)C.home.imgs.splice(i,1);
 else if(a=='gdel'&&ct)curAlb().imgs.splice(i,1);
 else if(a=='gcap'&&ct){const c=prompt('Chú thích ảnh',curAlb().imgs[i].cap||'');if(c==null)return;curAlb().imgs[i].cap=c}
 else if(a=='edel'&&ct){if(!confirm('Xóa sự kiện này?'))return;C.events.splice(i,1)}
 else if(a=='eedit'&&ct)return eform(+i);
 else if(a=='udel'&&adm()){if(!confirm('Xóa tài khoản này?'))return;users=users.filter(x=>x.u!=i);sv(UK,users);return render()}
 else return;
 csave();render()}
function hform(){const h=C.home;$('#fm').innerHTML=`<h3 style="margin-top:0">Chỉnh sửa trang chủ</h3><label>Tiêu đề</label><input id="h_t" value="${esc(h.title)}"><label>Giới thiệu (có thể dán mã HTML)</label><textarea id="h_x" rows="6">${esc(h.text)}</textarea>${btns}<button type="button" class="btn" id="h_cx">Hủy</button> <button class="btn p">Lưu</button></div>`;
 $('#dlg').showModal();$('#h_cx').onclick=()=>$('#dlg').close();$('#fm').onsubmit=()=>{h.title=$('#h_t').value;h.text=$('#h_x').value;csave();render()}}
function eform(i){const e=i==null?{date:'',title:'',desc:'',img:''}:{...C.events[i]};let im=e.img;
 $('#fm').innerHTML=`<h3 style="margin-top:0">${i==null?'Thêm':'Sửa'} sự kiện</h3><label>Ngày</label><input id="e_d" type="date" value="${esc(e.date)}"><label>Tiêu đề</label><input id="e_t" required value="${esc(e.title)}"><label>Nội dung</label><textarea id="e_x" rows="4">${esc(e.desc)}</textarea><label>Ảnh</label><input type="file" id="e_i" accept="image/*">${btns}<button type="button" class="btn" id="e_cx">Hủy</button> <button class="btn p">Lưu</button></div>`;
 $('#dlg').showModal();$('#e_cx').onclick=()=>$('#dlg').close();$('#e_i').onchange=ev=>ev.target.files[0]&&shrink(ev.target.files[0],900,d=>im=d);
 $('#fm').onsubmit=()=>{const o={date:$('#e_d').value,title:$('#e_t').value.trim(),desc:$('#e_x').value,img:im};if(i==null)C.events.push(o);else C.events[i]=o;csave();render()}}
const isH=t=>/<[a-z!\/]/i.test(t||'');
function clean(h){const t=document.createElement('template');t.innerHTML=h;t.content.querySelectorAll('script,object,embed,link,meta,base,form').forEach(n=>n.remove());t.content.querySelectorAll('*').forEach(n=>[...n.attributes].forEach(a=>{if(/^on|^srcdoc$/i.test(a.name)||/^\s*javascript:/i.test(a.value))n.removeAttribute(a.name)}));return t.innerHTML}
function norm(x){const k=(...n)=>{for(const a of n)if(x[a]!=null&&x[a]!=='')return x[a]};const num=v=>+String(v??'').replace(/\D/g,'')||0,str=(...n)=>String(k(...n)??'').trim();
 const id=num(k('id','ID','Id')),gv=str('g','gender','Giới tính').normalize('NFC'),sp=k('sids','sid','spouses','Vợ/Chồng ID','Vợ/Chồng');
 const sids=(Array.isArray(sp)?sp:String(sp??'').split(/[|,;\s]+/)).map(num).filter(Boolean);
 return id&&str('name','Họ tên')?{id,name:str('name','Họ tên'),g:/^(f|nữ|nu$)/i.test(gv)?'F':'M',by:str('by','Năm sinh'),dy:str('dy','Năm mất'),home:str('home','Quê quán'),job:str('job','Nghề nghiệp'),note:str('note','Ghi chú'),fid:num(k('fid','Cha ID')),mid:num(k('mid','Mẹ ID')),sids,img:str('img','Ảnh'),gen:num(k('gen','Đời'))||Math.floor(id/10000)||1}:null}
function doImport(txt){let j;try{j=JSON.parse(txt)}catch(e){return alert('Không đọc được JSON: '+e.message)}
 const a=(Array.isArray(j)?j:j&&(j.members||j.data||j.M))||[],L=a.map(norm).filter(Boolean);if(!L.length)return alert('Không có thành viên hợp lệ (cần ít nhất id và name).');

function order(){
 const gens=[...new Set(M.map(m=>m.gen))].sort((a,b)=>a-b),pos={},rows=[];
 gens.forEach(g=>{const L=M.filter(m=>m.gen==g),seen=new Set(),U=[];
  const pp=m=>{const a=[m.fid,m.mid].filter(x=>x&&pos[x]!=null).map(x=>pos[x]);return a.length?Math.min(...a):null};
  L.forEach(m=>{if(seen.has(m.id))return;const comp=[m];seen.add(m.id);
   for(let i=0;i<comp.length;i++)comp[i].sids.forEach(s=>{const o=get(s);if(o&&o.gen==g&&!seen.has(o.id)){seen.add(o.id);comp.push(o)}});
   const ks=comp.map(pp).filter(k=>k!=null);
   comp.sort((a,b)=>(pp(b)!=null)-(pp(a)!=null)||(a.g=='M'?-1:1)-(b.g=='M'?-1:1)||a.id-b.id);
   if(comp.length==2&&comp[0].g=='F'&&comp[1].g=='M')comp.reverse();
   U.push({c:comp,k:ks.length?Math.min(...ks):9999,id:Math.min(...comp.map(x=>x.id))})});
  U.sort((a,b)=>a.k-b.k||a.id-b.id);
  let p=0;U.forEach(u=>u.c.forEach(m=>pos[m.id]=p++));
  rows.push([g,U.map(u=>u.c)])});
 return rows;
}

function setZoom(nz,px,py){const vp=$('#vp');if(!vp)return;nz=Math.max(.2,Math.min(2.5,nz));if(px==null){px=vp.clientWidth/2;py=vp.clientHeight/2}const ox=(vp.scrollLeft+px)/zoom,oy=(vp.scrollTop+py)/zoom;zoom=nz;applyZoom();vp.scrollLeft=ox*zoom-px;vp.scrollTop=oy*zoom-py;lines()}

function bindZoom(){const vp=$('#vp');if(!vp)return;let dr=null,mv=0,pd=0,pz=1;

 vp.addEventListener('mousemove',e=>{if(!dr)return;const dx=e.clientX-dr[0],dy=e.clientY-dr[1];mv=Math.max(mv,Math.abs(dx)+Math.abs(dy));if(mv>4){vp.classList.add('dg');vp.scrollLeft=dr[2]-dx;vp.scrollTop=dr[3]-dy}});

 vp.addEventListener('touchstart',e=>{if(e.touches.length==2){pd=td(e);pz=zoom}},{passive:true});

  m.sids.filter(i=>!ns.includes(i)).forEach(i=>{const o=get(i);if(o)o.sids=o.sids.filter(j=>j!=m.id)});ns.forEach(i=>{const o=get(i);if(o&&!o.sids.includes(m.id))o.sids.push(m.id)});m.sids=ns;

 else if(id=='vt'){view='tree';page='tree';render()}
 else if(id=='vl'){view='list';page='tree';render()}

 else if((id=='ed'||id=='full')&&can('edit'))form(get(sel),false);
 else if(id=='zi')setZoom(zoom*1.2);else if(id=='zf')fitZoom()
 else if(id=='zo')setZoom(zoom/1.2)
 else if(id=='zr')setZoom(1)
 else if(id=='imp'&&can('edit'))impForm()
 else if(id=='rst'&&adm()){if(confirm('Xóa toàn bộ thành viên? Hãy xuất JSON để sao lưu trước.')){M=[];sel=undefined;save();render()}}
 else if(id=='exp'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(M,null,1)],{type:'application/json'}));a.download='gia-pha.json';a.click()}
});

// Tự động nạp dữ liệu khởi tạo cho cả Gia phả và Danh sách người dùng
(function loadInitialData() {
  const fetchAndStore = (key, filePath) => {
    const existingData = localStorage.getItem(key);
    
    // Nếu chưa có dữ liệu hoặc dữ liệu rỗng/null[cite: 3]
    if (!existingData || existingData === '""' || existingData === 'null' || existingData === '[]') {
      fetch(filePath)
        .then(res => res.ok ? res.json() : Promise.reject(res.status))
        .then(data => {
          localStorage.setItem(key, JSON.stringify(data));
          console.log(`Đã nạp thành công ${key}`);
          window.location.reload(); // Tải lại trang sau khi nạp xong
        })
        .catch(err => console.error(`Lỗi nạp file ${filePath}:`, err));
    }
  };

  // Nạp dữ liệu Cây gia phả[cite: 3]
  fetchAndStore('giapha_ngo_v1', './giapha_ngo_v1.json');
  
  // Nạp dữ liệu Danh sách tài khoản người dùng[cite: 3]
  fetchAndStore('giapha_users_v1', './giapha_users_v1.json');
})();
